<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vienna Life Assistant | SOTA Dashboard</title>
    <meta name="description" content="Next-generation life management interface for the Vienna ecosystem." />
    <script>
        // Fleet light-mode toggle: restore persisted choice before paint (no flash).
        try {
            if (localStorage.getItem("vilife-light-mode") === "1") {
                document.documentElement.classList.remove("dark");
            }
        } catch (e) {}
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
</head>

<body class="bg-[#050505] text-slate-200 antialiased selection:bg-cosmos-500/30 selection:text-cosmos-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
