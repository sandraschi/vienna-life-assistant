[project]
name = "vienna-life-assistant-sota"
version = "0.2.0"
description = "Vienna Life Assistant - State of the Art (SOTA) Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "fastmcp>=3.4.2,<4",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.50.0",
    "prefab-ui>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vienna_life_assistant --cov-report=term-missing --cov-fail-under=45"
